<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Codex GUI{% endblock %}</title>
  <link rel="stylesheet" href="{{ static_url('style.css') if static_url is defined else '/static/style.css?v=20261005' }}">
</head>
<body data-page="{% block page %}{% endblock %}" {% block bodyattrs %}{% endblock %}>
  <header class="topbar">
    <a class="brand" href="/">Codex GUI</a>
    {% block topbar %}{% endblock %}
  </header>
  <main>{% block content %}{% endblock %}</main>
  <script src="{{ static_url('context.js') if static_url is defined else '/static/context.js?v=20261005' }}"></script>
  <script src="{{ static_url('attachments.js') if static_url is defined else '/static/attachments.js?v=20261005' }}"></script>
  <script src="{{ static_url('app.js') if static_url is defined else '/static/app.js?v=20261005' }}"></script>
</body>
</html>
