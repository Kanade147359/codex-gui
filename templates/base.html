<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Codex GUI{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body data-page="{% block page %}{% endblock %}" {% block bodyattrs %}{% endblock %}>
  <header class="topbar">
    <a class="brand" href="/">Codex GUI</a>
    {% block topbar %}{% endblock %}
  </header>
  <main>{% block content %}{% endblock %}</main>
  <script src="/static/context.js"></script>
  <script src="/static/attachments.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
