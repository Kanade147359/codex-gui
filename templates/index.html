{% extends "base.html" %}
{% block page %}dashboard{% endblock %}
{% block topbar %}
<button id="new-task-btn" class="primary">+ New Task</button>
<label class="filter">Repository
  <select id="repo-filter"><option value="">All repositories</option></select>
</label>
{% endblock %}
{% block content %}
<table class="tasks" id="tasks-table">
  <thead>
    <tr><th>TASK</th><th>REPO</th><th>MODEL</th><th>STATUS</th><th>CACHE</th><th>GIT</th><th>BRANCH</th><th>CREATED</th></tr>
  </thead>
  <tbody id="tasks-body"><tr><td colspan="8" class="muted">loading…</td></tr></tbody>
</table>
<footer class="summary" id="summary"></footer>

<dialog id="new-task-dialog">
  <form id="new-task-form" method="dialog">
    <div id="form-body">
      <h2>New Task</h2>
      <div class="field">
        <span class="label">Repository</span>
        <div class="repo-row">
          <input name="repository" required placeholder="/home/you/workspace/repo" autocomplete="off">
          <button type="button" id="browse-btn">Browse…</button>
        </div>
        <div id="recent-repos" class="chips"></div>
      </div>
      <div class="row">
        <label>Base ref
          <select name="base_choice" id="base-select"><option value="main">main</option></select>
          <input name="base_custom" id="base-custom" placeholder="branch / tag / commit" hidden>
        </label>
        <label>Task name <input name="name" placeholder="(defaults to first line of prompt)"></label>
      </div>
      <label>Prompt
        <textarea name="prompt" rows="8" required placeholder="What should Codex do?"></textarea>
      </label>
      <div class="row">
        <label>Model
          <select name="model_choice" id="model-select"></select>
          <input name="model_custom" id="model-custom" placeholder="model id" hidden>
        </label>
        <label>Reasoning effort <select name="reasoning_effort" id="effort-select"></select></label>
        <label class="check"><input type="checkbox" name="auto_approval" checked> Auto approval (<code>--approve-for-me</code>)</label>
      </div>
      <p id="form-error" class="error" hidden></p>
      <p id="form-ok" class="ok" hidden></p>
      <div class="actions">
        <button type="button" id="cancel-btn">Close</button>
        <button type="button" id="run-more-btn" title="Create the task and keep this form open for the next one">Run &amp; add another</button>
        <button type="submit" class="primary" id="run-btn">Run</button>
      </div>
    </div>

    <div id="picker" hidden>
      <h2>Select repository folder</h2>
      <div class="repo-row">
        <input id="picker-path" autocomplete="off" spellcheck="false">
        <button type="button" id="picker-go">Go</button>
      </div>
      <label class="check inline"><input type="checkbox" id="picker-hidden"> show hidden folders</label>
      <ul id="picker-list" class="picker-list"></ul>
      <p id="picker-info" class="muted"></p>
      <div class="actions">
        <button type="button" id="picker-back">Back</button>
        <button type="button" class="primary" id="picker-select" disabled>Select this folder</button>
      </div>
    </div>
  </form>
</dialog>
{% endblock %}
