name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install isolated validation and browser dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap
          python -m pip install -r requirements-dev.txt 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
      - name: Run regression and isolated browser tests
        env:
          CODEX_GUI_BROWSER: '1'
        run: python -m pytest -q --junitxml=test-results/pytest.xml
      - name: Save test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore
