name: PR12 apply reviewed fix
on:
  pull_request:
    branches: [main]
    types: [synchronize]
permissions:
  contents: read
concurrency:
  group: pr12-reviewed-fix
  cancel-in-progress: false
jobs:
  apply:
    if: >-
      github.event.pull_request.number == 12 &&
      github.event.pull_request.head.repo.full_name == 'Kanade147359/codex-gui' &&
      github.event.pull_request.head.ref == 'feature/terra-auto-routing-metrics-handoff'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/terra-auto-routing-metrics-handoff
          persist-credentials: false
      - name: Check one-time transfer
        id: present
        run: |
          if test -f .pr12-review.patch.03.b64; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.present.outputs.ready == 'true'
        with:
          python-version: '3.12'
      - name: Verify and apply exact reviewed patch
        if: steps.present.outputs.ready == 'true'
        run: |
          python - <<'PY'
          import base64, gzip, hashlib
          from pathlib import Path
          encoded = ''.join(Path(f'.pr12-review.patch.{i:02}.b64').read_text().strip() for i in range(4))
          # Correct the identified single-character transport duplication before verification.
          encoded = encoded.replace('BUZq/YBTnnXYj', 'BUZq/YBTnXYj')
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'c99fcc84acd75bdcd390a3a481e16caa4217d40ace51712ac3683c2c8c942c74'
          Path('/tmp/pr12-reviewed.patch').write_bytes(patch)
          PY
          git apply --check /tmp/pr12-reviewed.patch
          git apply /tmp/pr12-reviewed.patch
          git diff --check
          python -m compileall -q app
          node --check static/app.js
          node --check static/model_metrics.js
      - name: Run focused regression tests
        if: steps.present.outputs.ready == 'true'
        run: |
          python -m pip install -q -r requirements-dev.txt
          python -m pytest -q tests/test_model_routing.py tests/test_model_routing_safety.py tests/test_database.py --junitxml=/tmp/pr12-focused.xml
      - name: Commit source changes to the existing PR branch only
        if: steps.present.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/database.py app/model_routing.py app/task_manager.py docs/model-routing.md static/app.js static/model_metrics.js static/style.css templates/model_metrics.html tests/fake_codex.py tests/test_model_routing.py tests/test_model_routing_browser.py tests/test_model_routing_safety.py
          git rm -- .pr12-review.patch.00.b64 .pr12-review.patch.01.b64 .pr12-review.patch.02.b64 .pr12-review.patch.03.b64
          git diff --cached --check
          git commit -m 'fix: preserve routing intent, enforce consent and correct model accounting'
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/feature/terra-auto-routing-metrics-handoff
      - uses: actions/upload-artifact@v4
        if: always() && steps.present.outputs.ready == 'true'
        with:
          name: pr12-focused-results
          path: /tmp/pr12-focused.xml
          if-no-files-found: ignore
          retention-days: 3
